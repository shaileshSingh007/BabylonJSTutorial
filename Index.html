<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babylon.js Tutorial for Absolute Beginners</title>
<style>
:root{--bg:#eef3f8;--cd:#fff;--tx:#142033;--mu:#53627a;--ac:#0e7490;--so:#e3f1f6;--bd:#d3deea;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--cd:#152033;--tx:#e6edf7;--mu:#93a3bd;--ac:#4cc9f0;--so:#102536;--bd:#243450;--on:#06202b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1420;--cd:#152033;--tx:#e6edf7;--mu:#93a3bd;--ac:#4cc9f0;--so:#102536;--bd:#243450;--on:#06202b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--bd)}
.w{max-width:820px;margin:0 auto;padding:0 16px}
.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding-top:12px}
.top b{font-size:18px;letter-spacing:-.01em}.top span{color:var(--mu);font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;max-width:820px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button,.pn button{flex:none;font:600 14px system-ui,sans-serif;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ac);border-color:var(--ac);color:var(--on)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding-top:20px;padding-bottom:40px}
.lv{display:inline-block;background:var(--so);color:var(--ac);font:700 13px system-ui,sans-serif;padding:3px 10px;border-radius:6px;margin-right:6px}
.sp{color:var(--mu);font-size:13px}
h1{font-size:30px;line-height:1.15;margin:12px 0 10px;letter-spacing:-.02em}
.st{font-size:17px;color:var(--mu);border-left:3px solid var(--ac);padding-left:14px;margin:0 0 8px}
section{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:16px 0}
h2{font-size:20px;line-height:1.3;margin:0 0 6px}
p{margin:8px 0}
code{background:var(--so);color:var(--ac);padding:1px 6px;border-radius:5px;font:.88em ui-monospace,Menlo,Consolas,monospace}
figure{margin:12px 0;padding:10px;border-radius:10px;background:linear-gradient(var(--bd) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,var(--bd) 1px,transparent 1px) 0 0/20px 20px,var(--so)}
figure svg{display:block;width:100%;max-height:170px}
figcaption{font-size:13px;color:var(--mu);text-align:center;margin-top:4px}
.b{fill:var(--cd);stroke:var(--ac);stroke-width:2}.l{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round}.g{fill:var(--ac);opacity:.3}
svg text{fill:var(--tx);font:600 11px system-ui,sans-serif;text-anchor:middle}
.cb{background:#0f1520;border-radius:10px;overflow:hidden;margin:12px 0}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 12px;color:#8fa0ba;font:600 12px ui-monospace,Menlo,monospace;border-bottom:1px solid #222d40}
.ch button{font:600 12px system-ui,sans-serif;background:#22314a;color:#e6edf7;border:0;border-radius:6px;padding:5px 12px;cursor:pointer}
pre{margin:0;padding:12px;overflow-x:auto;color:#dbe6f7;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace}
pre code{background:none;color:inherit;padding:0;font:inherit}
.tip{background:var(--so);border-radius:8px;padding:10px 12px;font-size:15px}
.pn{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
</style>
</head>
<body>
<header><div class="w top"><b id="t"></b><span id="g"></span></div><nav id="n" role="tablist"></nav></header>
<main class="w" id="p"></main>
<script type="application/json" id="d">{"site":{"title":"Babylon.js for Absolute Beginners","tag":"CDN edition, no build tools"},"tabs":[{"id":"install","title":"Installations","level":"Basic","story":"Our journey starts in an empty folder. Before any 3D appears, we set up a tiny workshop: two files and one script tag that brings Babylon.js in from a CDN.","sections":[{"h":"Shortcut: the Playground","p":"Don’t want to set anything up? The Babylon.js Playground runs and shares snippets right in the browser. For a real project, follow the steps below."},{"h":"1. Create the files","p":"Make a folder with two files: `index.html` for the page and `main.js` for your code. No installs and no build tools.","lang":"bash","code":"mkdir my-babylon-app\ncd my-babylon-app\ntouch index.html main.js","tip":"You can also just create both files in your code editor."},{"h":"2. Load Babylon.js from a CDN","p":"A CDN is a fast public server that hosts the library. One script tag downloads Babylon.js and creates a global object named `BABYLON`, so every class starts with `BABYLON.` and no `import` is needed.","img":"stack","cap":"Your page loads the CDN script, then your own script","lang":"html","code":"<!DOCTYPE html>\n<html lang='en'>\n<head>\n  <meta charset='UTF-8'>\n  <meta name='viewport' content='width=device-width, initial-scale=1.0'>\n  <title>Babylon.js Tutorial<\/title>\n<\/head>\n<body>\n  <script src='https://cdn.babylonjs.com/babylon.js'><\/script>\n  <script src='main.js'><\/script>\n<\/body>\n<\/html>","tip":"Load Babylon.js first and your own script second. `main.js` needs `BABYLON` to exist already."},{"h":"3. Check that it works","p":"Put this line in `main.js`, open `index.html` in your browser and look at the console.","code":"console.log(BABYLON.Engine.Version); // prints the Babylon.js version"},{"h":"4. Run a tiny local server","p":"Opening the file directly works for now. Later, loading images, fonts, models and sounds needs a local server, because browsers block those requests on `file://` pages. Any one of these is enough; then open `http://localhost:8000`.","lang":"bash","code":"# Python\npython3 -m http.server 8000\n\n# or Node\nnpx serve .\n\n# or use the Live Server extension in VS Code","tip":"Live Server also reloads the page every time you save."}]},{"id":"horsemen","title":"The 4 Horsemen","level":"Basic","story":"Every Babylon.js app, however big, rides on the same four things. We meet them one by one and end with a working first scene.","sections":[{"h":"Meet the four","p":"The `<canvas>` is the space on your page. The Engine is the brain that turns your logic into 3D graphics. The Scene is the 3D space. The Camera shows one area of that space.","img":"horsemen","cap":"The four building blocks of every app"},{"h":"1. The canvas","p":"Place it before the script tags.","lang":"html","code":"<body>\n  <canvas id='renderCanvas'><\/canvas>\n  <script src='https://cdn.babylonjs.com/babylon.js'><\/script>\n  <script src='main.js'><\/script>\n<\/body>"},{"h":"2. The engine","p":"In `main.js`, grab the canvas and give it to the engine so it knows where to draw. There is no `import`: the CDN script already made `BABYLON` available.","code":"const canvas = document.getElementById('renderCanvas');\nconst engine = new BABYLON.Engine(canvas);"},{"h":"3. The scene","p":"Put all your app logic in a `createScene` function that returns a scene. Calling `render()` draws one frame.","code":"const createScene = function () {\n  const scene = new BABYLON.Scene(engine);\n\n  // your application logic goes here\n\n  return scene;\n};\n\nconst scene = createScene();\nscene.render(); // draws ONE frame"},{"h":"The render loop","p":"Animation, in a video or a game, is a sequence of pictures called frames. One `render()` call gives a still image. A render loop calls it many times per second, as fast as the device allows.","img":"frames","cap":"Many frames per second make motion","code":"engine.runRenderLoop(function () {\n  scene.render();\n});","tip":"Congratulations: your first app is running! The console warns that the camera is missing, so we fix that next."},{"h":"4. The camera","p":"Babylon.js can make a default camera and light for you. We study real cameras later. Add this inside `createScene()`.","code":"scene.createDefaultCameraOrLight(true, false, true);"},{"h":"Full-screen canvas","p":"A little CSS in the `<head>` makes the canvas fill the page.","lang":"css","code":"html, body {\n  overflow: hidden;\n  width: 100%;\n  height: 100%;\n  margin: 0;\n  padding: 0;\n}\n\n#renderCanvas {\n  width: 100%;\n  height: 100%;\n  touch-action: none;\n}"},{"h":"Make it responsive","p":"Resize the window and a cube would stretch. Tell the engine each time the window changes size.","code":"// outside createScene()\nwindow.addEventListener('resize', function () {\n  engine.resize();\n});"},{"h":"Your starter template","p":"Make `main.js` look like this. Every later tab adds code where it says `the fun stuff`.","code":"const canvas = document.getElementById('renderCanvas');\nconst engine = new BABYLON.Engine(canvas);\n\nconst createScene = function () {\n  const scene = new BABYLON.Scene(engine);\n  scene.createDefaultCameraOrLight(true, false, true);\n\n  // The fun stuff\n\n  return scene;\n};\n\nconst scene = createScene();\n\nengine.runRenderLoop(function () {\n  scene.render();\n});\n\nwindow.addEventListener('resize', function () {\n  engine.resize();\n});"}]},{"id":"mesh","title":"MeshBuilder","level":"Basic","story":"The stage is ready but empty. MeshBuilder is the workshop that fills it. Every call has the same shape: a name, an options object and the scene.","sections":[{"h":"What is a mesh?","p":"Any object in a scene is a mesh: a simple box, a torus knot, or a complex model from Blender. `MeshBuilder` is a helper class that builds common ones in one line. We build five; explore the others as homework.","img":"shapes","cap":"Three of the shapes we build"},{"h":"Sphere","p":"The name helps you find the mesh later (we use it for picking). Raise `segments` for a smoother ball, and use `diameterY` to stretch one axis.","img":"segments","cap":"More segments means more triangles and more detail","code":"const sphere = BABYLON.MeshBuilder.CreateSphere(\n  'mySphere',\n  { segments: 50, diameter: 0.3, diameterY: 0.4 },\n  scene\n);"},{"h":"Box","p":"Use `size` for a cube, or `width`, `height` and `depth` one by one. `faceColors` paints each face. A Color4 has red, green, blue and opacity; Color3 skips opacity.","code":"const box = BABYLON.MeshBuilder.CreateBox('myBox', {\n  width: 2,\n  height: 0.05,\n  depth: 0.5,\n  faceColors: [\n    new BABYLON.Color4(1, 0.2, 0.5, 1),\n    new BABYLON.Color4(0.2, 0.1, 0.3, 1),\n    new BABYLON.Color4(0.5, 0, 1, 1)\n  ]\n});","tip":"The scene argument is optional when your app has only one scene."},{"h":"Ground","p":"A flat rectangle with a width and height. `subdivisions` cuts it into a grid, like a sphere’s segments. You can’t see the grid until you switch on wireframe. Use `subdivisionsX` and `subdivisionsY` for different counts.","img":"grid","cap":"Subdivisions matter when you move vertices to shape terrain","code":"const ground = BABYLON.MeshBuilder.CreateGround('myGround', {\n  width: 3,\n  height: 3,\n  subdivisions: 30\n});\nground.material = new BABYLON.StandardMaterial();\nground.material.wireframe = true; // show the grid"},{"h":"Ground from Height Map","p":"A height map is a grayscale image: the whiter a pixel, the higher the point; the blacker, the lower. Put the image in `images/` and pass its path.","img":"heightmap","cap":"Brightness in the image turns into height","code":"const terrain = BABYLON.MeshBuilder.CreateGroundFromHeightMap(\n  'myTerrain',\n  'images/heightmap.png',\n  { width: 3, height: 3, subdivisions: 100, maxHeight: 0.5 }\n);","tip":"Default subdivisions is 1, so raise it to see detail, but more subdivisions cost more performance. `minHeight` and `maxHeight` set the altitude range."},{"h":"Text","p":"3D text needs a font in JSON format (convert a `.ttf` with a tool like Facetype.js and put it in a `fonts` folder) plus the `earcut` library, which cuts letter shapes into triangles. Add its CDN script to `index.html`, before `main.js`.","lang":"html","code":"<script src='https://cdnjs.cloudflare.com/ajax/libs/earcut/2.2.4/earcut.min.js'><\/script>\n<script src='https://cdn.babylonjs.com/babylon.js'><\/script>\n<script src='main.js'><\/script>"},{"h":"Text: create the mesh","p":"Loading the font is asynchronous, so `createScene` becomes `async` and the render loop starts once the scene is ready. The arguments are: name, text, font data, options and scene. Babylon.js finds the global `earcut` by itself.","code":"const createScene = async function () {\n  const scene = new BABYLON.Scene(engine);\n  scene.createDefaultCameraOrLight(true, false, true);\n\n  const fontData = await (await fetch('fonts/GreatVibes.json')).json();\n\n  const text = BABYLON.MeshBuilder.CreateText(\n    'myText', 'Hello Babylon!', fontData,\n    { size: 0.5, depth: 0.05, resolution: 32 },\n    scene\n  );\n\n  return scene;\n};\n\ncreateScene().then(function (scene) {\n  engine.runRenderLoop(function () {\n    scene.render();\n  });\n});","tip":"Use your own converted font file name instead of `GreatVibes.json`."}]},{"id":"camera","title":"Cameras","level":"Intermediate","story":"Shapes are on stage, so now we choose how the audience looks. Babylon.js has many cameras, but most apps use only two.","sections":[{"h":"Universal Camera","p":"Think first-person shooter: the mouse picks the direction and the arrow keys move. It takes a name, a start position and the scene. First remove the default camera and add a default light.","img":"cameras","cap":"Walk around, or orbit a target","code":"// scene.createDefaultCameraOrLight(true, false, true);\nscene.createDefaultLight();\n\nconst camera = new BABYLON.UniversalCamera(\n  'uCamera',\n  new BABYLON.Vector3(0, 1, -5),\n  scene\n);\ncamera.attachControl();                    // enable input\ncamera.inputs.addMouseWheel();             // wheel moves too\ncamera.setTarget(BABYLON.Vector3.Zero());  // look at the center"},{"h":"Arc Rotate Camera","p":"It orbits a target. Its constructor takes a name, alpha, beta, radius, target and scene. `setPosition` lets you place it with plain coordinates instead of angles.","code":"const camera = new BABYLON.ArcRotateCamera(\n  'arCamera', 0, 0, 10, BABYLON.Vector3.Zero(), scene\n);\ncamera.attachControl();\ncamera.setPosition(new BABYLON.Vector3(0, 0, -10));"},{"h":"Limit the movement","p":"Beta limits vertical rotation, alpha limits horizontal rotation, and radius limits how near or far the camera can be.","code":"camera.lowerBetaLimit = Math.PI / 4;\ncamera.upperBetaLimit = Math.PI / 2;\n\ncamera.lowerAlphaLimit = Math.PI / 4;\ncamera.upperAlphaLimit = Math.PI / 2;\n\ncamera.lowerRadiusLimit = 8;\ncamera.upperRadiusLimit = 15;"}]},{"id":"material","title":"Materials","level":"Intermediate","story":"Our shapes are bare. A mesh is made of points and lines that give it shape, plus a material that covers them. Colors and textures live in the material.","sections":[{"h":"Meshes wear materials","p":"Create a `StandardMaterial` and assign it. Nothing changes yet, but now we can restyle the sphere.","img":"material","cap":"Shape + material = what you see","code":"const sphere = BABYLON.MeshBuilder.CreateSphere('', { diameter: 0.5 });\nconst sphereMaterial = new BABYLON.StandardMaterial();\nsphere.material = sphereMaterial;"},{"h":"Colors","p":"`diffuseColor` is the main color. `specularColor` colors the highlight spot made by a light. Both depend on a light; with no light you get a dark object.","code":"sphereMaterial.diffuseColor = new BABYLON.Color3(0.9, 0.2, 0.4);\nsphereMaterial.specularColor = new BABYLON.Color3(0, 1, 0);"},{"h":"Ambient, emissive, alpha, wireframe","p":"`ambientColor` only works if the scene’s `ambientColor` has non-zero values in the same channels. `emissiveColor` colors the mesh even without light. `alpha` sets opacity. `wireframe` shows the mesh’s skeleton.","code":"sphereMaterial.ambientColor = new BABYLON.Color3(0, 1, 1);\nscene.ambientColor = new BABYLON.Color3(0, 0.5, 0.5);\n\nsphereMaterial.emissiveColor = new BABYLON.Color3(0.5, 0, 0.5);\nsphereMaterial.alpha = 0.5;       // 1 = solid\nsphereMaterial.wireframe = true;"},{"h":"Textures","p":"Set `diffuseTexture` for a picture that needs light. Use `emissiveTexture` if the picture should show without any light.","code":"sphereMaterial.diffuseTexture = new BABYLON.Texture('images/earth.jpg');\n\n// shows even without light:\n// sphereMaterial.emissiveTexture = new BABYLON.Texture('images/earth.jpg');","tip":"Put your own image in `images/`, and use your file name."},{"h":"A different picture on each face","p":"Cut one long image into six blocks. Each block is a Vector4 holding its lower-left and upper-right corners. Add `wrap: true` or the pieces appear flipped.","img":"uv","cap":"faceUV maps image blocks to box faces","code":"const box = BABYLON.MeshBuilder.CreateBox('', {\n  size: 0.3,\n  faceUV: [\n    new BABYLON.Vector4(0, 0, 1 / 6, 1),\n    new BABYLON.Vector4(1 / 6, 0, 2 / 6, 1),\n    new BABYLON.Vector4(2 / 6, 0, 3 / 6, 1),\n    new BABYLON.Vector4(3 / 6, 0, 4 / 6, 1),\n    new BABYLON.Vector4(4 / 6, 0, 5 / 6, 1),\n    new BABYLON.Vector4(5 / 6, 0, 1, 1)\n  ],\n  wrap: true\n});\nconst boxMaterial = new BABYLON.StandardMaterial();\nboxMaterial.emissiveTexture = new BABYLON.Texture('images/faces.png');\nbox.material = boxMaterial;"},{"h":"Offset and scale","p":"`uOffset` and `vOffset` slide the texture sideways or up and down. `uScale` and `vScale` shrink it to fit the mesh, or repeat it when above 1.","code":"const tex = groundMaterial.emissiveTexture;\n\ntex.uOffset = 1.4;  // move left or right\ntex.vOffset = 1.4;  // move up or down\n\ntex.uScale = 3;     // repeat 3 times across\ntex.vScale = 2;     // repeat 2 times along"}]},{"id":"transform","title":"Transformations and Gizmos","level":"Intermediate","story":"New meshes appear at (0, 0, 0). To place them, we move, turn and stretch them, and then use gizmos to do the same with our mouse.","sections":[{"h":"Geometric Transformations","p":"Every mesh has `position`, `rotation` (in radians) and `scaling`. Change one axis at a time, or assign a whole Vector3.","img":"axes","cap":"The three axes and the three dials","code":"box.position.x = 1;\nbox.position = new BABYLON.Vector3(-0.5, 0.2, 0.1);\n\nbox.rotation.z = Math.PI / 3;\nbox.rotation = new BABYLON.Vector3(0, 0, Math.PI / 3);\n\nbox.scaling.x = 2;\nbox.scaling = new BABYLON.Vector3(2, 0.8, 2.5);"},{"h":"Gizmos: handles you can drag","p":"Gizmos are handy for debugging, and you can even ship them. Create a `UtilityLayerRenderer` (recommended) and attach the gizmo to a mesh.","code":"const utilLayer = new BABYLON.UtilityLayerRenderer(scene);\nconst positionGizmo = new BABYLON.PositionGizmo(utilLayer);\npositionGizmo.attachedMesh = box;"},{"h":"Rotation, scale and plane rotation","p":"Rotating and scaling work the same way. A `PlaneRotationGizmo` turns the mesh around just one axis, so it needs that axis and a color.","code":"const rotationGizmo = new BABYLON.RotationGizmo(utilLayer);\nrotationGizmo.attachedMesh = box;\n\nconst scaleGizmo = new BABYLON.ScaleGizmo(utilLayer);\nscaleGizmo.attachedMesh = box;\n\nconst planeGizmo = new BABYLON.PlaneRotationGizmo(\n  new BABYLON.Vector3(0, 1, 0),  // axis\n  new BABYLON.Color3(1, 0, 0),   // color\n  utilLayer\n);\nplaneGizmo.attachedMesh = box;","tip":"Try one gizmo at a time to keep the scene readable."}]},{"id":"animation","title":"Animation","level":"Intermediate","story":"Back to the render loop. A 3D scene is a flipbook of frames, so animating just means changing something a little on every frame. We go from easiest to most flexible.","sections":[{"h":"registerBeforeRender","p":"The easiest way. Your function runs before every frame. This one turns the box by 0.01 radians about 60 times per second.","code":"scene.registerBeforeRender(function () {\n  box.rotation.x += 0.01;\n  box.rotation.y += 0.01;\n  box.rotation.z += 0.01;\n});"},{"h":"CreateAndStartAnimation","p":"One call. Arguments: name, mesh, property, frames per second, total frames, start value, end value. Here 120 frames at 30 fps is 4 seconds. By default it loops forever; the last two arguments are optional (play once, and an easing).","code":"BABYLON.Animation.CreateAndStartAnimation(\n  'xScaleAnimation', box, 'scaling.x',\n  30,    // frames per second\n  120,   // total frames\n  0, 2,  // from, to\n  BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT, // play once\n  new BABYLON.CircleEase()                       // easing\n);"},{"h":"beginAnimation","p":"The most control. Make an Animation, give it keyframes (a frame number plus a value), attach it to the mesh, then begin. Want it slower? Use a bigger last frame number.","img":"anim","cap":"Keyframes are the dots; Babylon.js fills in between","code":"const animation = new BABYLON.Animation(\n  'yRotAnimation', 'rotation.y', 30,\n  BABYLON.Animation.ANIMATIONTYPE_FLOAT,\n  BABYLON.Animation.ANIMATIONLOOPMODE_CYCLE\n);\n\nanimation.setKeys([\n  { frame: 0, value: 0 },\n  { frame: 60, value: Math.PI * 2 }\n]);\n\nbox.animations = [];\nbox.animations.push(animation);\n\nscene.beginAnimation(box, 0, 60, true); // target, from, to, loop"}]},{"id":"lights","title":"Lights","level":"Intermediate","story":"A scene without light is a dark room. Good lighting changes everything, and Babylon.js offers four types. For these experiments, use a clean scene with an ArcRotateCamera and a ground, and no default light.","sections":[{"h":"Four kinds of light","p":"Point lights shine in every direction, spotlights in a cone, directional lights send parallel rays, and hemispheric lights give soft ambient light.","img":"lights","cap":"The four light types"},{"h":"Point Light","p":"It shines in all directions, like a candle. It takes a name, a position and the scene. A `LightGizmo` shows where the light is.","code":"const light = new BABYLON.PointLight(\n  'pointLight', new BABYLON.Vector3(0, 1, 0), scene\n);\n\nconst utilLayer = new BABYLON.UtilityLayerRenderer(scene);\nconst lightGizmo = new BABYLON.LightGizmo(utilLayer);\nlightGizmo.light = light;"},{"h":"Spotlight","p":"A cone of light, like theatre lighting. Arguments: name, position, direction, cone angle, decay with distance, scene. `range` is the farthest it reaches.","code":"const light = new BABYLON.SpotLight(\n  'spotlight',\n  new BABYLON.Vector3(0, 1, 0),   // position\n  new BABYLON.Vector3(0, -1, 0),  // direction\n  Math.PI / 3,                    // cone angle\n  2,                              // decay\n  scene\n);\nlight.range = 10;"},{"h":"Directional Light","p":"Parallel rays from one direction, like the sun far away. It needs only a name, a direction and the scene.","code":"const light = new BABYLON.DirectionalLight(\n  'directionalLight', new BABYLON.Vector3(-2, -3, 0), scene\n);\nlight.intensity = 0.5;"},{"h":"Hemispheric Light","p":"Soft light from sky and ground. The direction points to the sky. `groundColor` lights the opposite side, `diffuse` is the main color and `specular` colors the highlights.","code":"const light = new BABYLON.HemisphericLight(\n  'hemisphericLight', new BABYLON.Vector3(-5, 2, 0), scene\n);\nlight.groundColor = new BABYLON.Color3(0, 1, 0);\nlight.diffuse = new BABYLON.Color3(0, 0, 1);\nlight.specular = new BABYLON.Color3(0, 1, 0);"}]},{"id":"shadow","title":"Shadow","level":"Intermediate","story":"You can’t talk about light without shadows. A shadow needs three actors: one that casts it, one that receives it, and a light.","sections":[{"h":"Set the stage","p":"Use a ground as the receiver, a named sphere as the caster, and a directional light.","img":"shadow","cap":"Light, caster, receiver: all three are needed","code":"const sphere = BABYLON.MeshBuilder.CreateSphere(\n  'shadowCaster', { diameter: 0.3 }\n);\nsphere.position = new BABYLON.Vector3(1, 1.5, 0);\n\nconst light = new BABYLON.DirectionalLight(\n  'directionalLight', new BABYLON.Vector3(-2, -3, 0), scene\n);"},{"h":"The shadow generator","p":"Each shadow-casting light needs one. The first argument is the shadow quality (low values look pixelated), the second is the light. Then list casters and receivers.","code":"const shadowGenerator = new BABYLON.ShadowGenerator(1024, light);\nshadowGenerator.addShadowCaster(sphere);\nground.receiveShadows = true;"},{"h":"Make it look real","p":"`setDarkness` controls the shadow strength (0 is fully dark, 1 means no shadow). The exponential blur map removes pixelated edges, and kernel blur gives the soft edges real shadows have.","code":"shadowGenerator.setDarkness(0.8);\nshadowGenerator.useBlurExponentialShadowMap = true;\nshadowGenerator.useKernelBlur = true;\nshadowGenerator.blurKernel = 64;"}]},{"id":"fog","title":"Fog","level":"Intermediate","story":"Fog adds atmosphere and hides the far distance. Babylon.js has four fog modes: none, linear, exponential and exponential squared.","sections":[{"h":"Linear fog","p":"Density grows steadily with distance from the camera. `fogStart` is where fog begins and `fogEnd` is where objects vanish completely.","img":"fog","cap":"The farther away, the thicker the fog","code":"scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;\nscene.fogStart = 10;\nscene.fogEnd = 50;"},{"h":"Exponential fog","p":"EXP and EXP2 thicken faster with distance (EXP2 faster still). They use a density instead of a start and end.","code":"scene.fogMode = BABYLON.Scene.FOGMODE_EXP;   // or FOGMODE_EXP2\nscene.fogDensity = 0.2;"},{"h":"Fog color","p":"Match the fog to your background and distant objects melt away.","code":"scene.fogColor = new BABYLON.Color3(0.3, 0.2, 0.6);"}]},{"id":"raycast","title":"Picking Objects (Raycast)","level":"Advanced","story":"Now we make the world interactive. When you click, Babylon.js shoots an invisible ray from the pointer into the scene and tells you what it hit.","sections":[{"h":"Pick with a pointer event","p":"A pointer event can be a mouse move, a click or a screen touch. `onPointerDown` fires on press, and `scene.pick` returns whatever is under the pointer.","img":"ray","cap":"A click becomes a ray that returns the mesh it hits","code":"scene.onPointerDown = function castRay() {\n  const hit = scene.pick(scene.pointerX, scene.pointerY);\n};"},{"h":"Check what you hit","p":"The hit could be the ground, the sphere, or nothing at all. First check that a mesh was picked, then check its name. This is why we named our meshes.","code":"scene.onPointerDown = function castRay() {\n  const hit = scene.pick(scene.pointerX, scene.pointerY);\n\n  if (hit.pickedMesh && hit.pickedMesh.name === 'shadowCaster') {\n    hit.pickedMesh.material = new BABYLON.StandardMaterial();\n    hit.pickedMesh.material.diffuseColor = BABYLON.Color3.Random();\n  }\n};","tip":"Skip the `pickedMesh` check and clicking empty space throws an error."}]},{"id":"models","title":"Loading and Animating Models","level":"Advanced","story":"Real projects rarely build everything from primitives. They load models made in Blender or downloaded from the web, often with ready-made animations.","sections":[{"h":"Formats and the loader","p":"The `.babylon` format works out of the box. For `.gltf`, `.glb` or `.obj` you also load the loaders script from the CDN, after Babylon.js and before `main.js`.","img":"model","cap":"A model file goes through a loader into your scene","code":"<script src='https://cdn.babylonjs.com/babylon.js'><\/script>\n<script src='https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js'><\/script>\n<script src='main.js'><\/script>","lang":"html"},{"h":"ImportMesh","p":"Put the file in `models/`. Arguments: which meshes to load (`null` for all), the folder, the file name, the scene, and an optional callback that runs when loading finishes.","code":"BABYLON.SceneLoader.ImportMesh(\n  null, 'models/', 'Fox.gltf', scene,\n  function (meshes, particleSystems, skeletons, animationGroups) {\n    const model = meshes[0];\n    model.scaling = new BABYLON.Vector3(0.5, 0.5, 0.5);\n    shadowGenerator.addShadowCaster(model);\n  }\n);"},{"h":"Play an animation","p":"Models can carry several animation groups. The first one plays by default, so stop it and play another. Passing `true` makes it loop.","code":"// inside the callback\nanimationGroups[0].stop();\nanimationGroups[5].play(true); // true = loop","tip":"Index 5 belongs to the fox model. Log `animationGroups` to see which animations your model has."},{"h":"ImportMeshAsync","p":"The promise-based version. Both methods are asynchronous.","code":"BABYLON.SceneLoader.ImportMeshAsync(null, 'models/', 'Fox.gltf', scene)\n  .then((result) => {\n    const model = result.meshes[0];\n    model.scaling = new BABYLON.Vector3(0.5, 0.5, 0.5);\n    result.animationGroups[3].play(true);\n  });"}]},{"id":"sound","title":"Sound","level":"Advanced","story":"A world feels empty without a soundtrack. Adding ambient music takes a single object.","sections":[{"h":"Background music","p":"Put your audio file in `audio/`. A `Sound` takes a name, the file path, the scene, a callback for when loading ends, and an options object.","img":"sound","cap":"Load a file, then loop it in the background","code":"const bgMusic = new BABYLON.Sound(\n  'backgroundMusic',\n  'audio/piano.wav',\n  scene,\n  null,\n  { autoplay: true, loop: true }\n);","tip":"Browsers often block sound until the visitor interacts with the page."},{"h":"Control it yourself","p":"Skip `autoplay` and start or stop the sound from your own code, for example on a click.","code":"bgMusic.play();\nbgMusic.pause();\nbgMusic.stop();"}]},{"id":"tools","title":"Tools","level":"Advanced","story":"One thing that sets Babylon.js apart is its tool set. These tools make debugging easier and let you share work with the community.","sections":[{"h":"Three helpers","p":"The Playground (used all through the original tutorial) writes and shares snippets online. The Inspector, Sandbox and Node Material Editor cover debugging, previewing and shaders.","img":"tools","cap":"Debug, preview, and build shaders without code"},{"h":"Inspector","p":"A visual panel to explore and edit your scene live: objects, textures, materials and animations. You can take screenshots, record video, and export the scene as `.babylon` or `.gltf`.","code":"// 1) index.html: add this script after babylon.js\n// <script src='https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js'><\/script>\n\n// 2) main.js: add this at the end of your script\nscene.debugLayer.show();"},{"h":"Sandbox","p":"Drop a model into the Sandbox to preview and inspect it before you use it in a project."},{"h":"Node Material Editor","p":"Build shaders by connecting nodes, with no code at all. Shaders are an advanced topic for another day.","tip":"A shader is a small program that tells the graphics card how to color each pixel."}]},{"id":"final","title":"Final Thoughts","level":"Wrap-up","story":"We started in an empty folder and now have shapes, cameras, materials, motion, lights, shadows, fog, clicks, models and sound.","sections":[{"h":"Where to go next","p":"This is only the surface of what Babylon.js can do, so keep experimenting. A good first project: a room with a textured floor, a spotlight and a rotating box that changes color when clicked. Then load a model and add background music."},{"h":"Credits and resources","p":"This guide follows the storyline of ‘Babylon.js Tutorial for Absolute Beginners’ by Wael Yasmina, retold with new graphics, short code samples and plain CDN script tags instead of npm. The original used an Earth heightmap, the Great Vibes font, a SPY-HYPERSPORT texture and a Fox model."}]}]}</script>
<script>

frames:S(`<rect class="b" x="14" y="22" width="60" height="44" rx="4"/><circle class="g" cx="34" cy="44" r="8"/><rect class="b" x="94" y="22" width="60" height="44" rx="4"/><circle class="g" cx="124" cy="44" r="8"/><rect class="b" x="174" y="22" width="60" height="44" rx="4"/><circle class="g" cx="214" cy="44" r="8"/><path class="l" d="M240 44h20"/><text x="288" y="48">~60 fps</text><text x="44" y="86">frame 1</text><text x="124" y="86">frame 2</text><text x="204" y="86">frame 3</text>`),

tools:S(`<rect class="b" x="6" y="22" width="96" height="50" rx="8"/><text x="54" y="44">Inspector</text><text x="54" y="60">debug live</text><rect class="b" x="112" y="22" width="96" height="50" rx="8"/><text x="160" y="44">Sandbox</text><text x="160" y="60">preview models</text><rect class="b" x="218" y="22" width="96" height="50" rx="8"/><text x="266" y="44">Node Material</text><text x="266" y="60">no-code shaders</text>`),
uv:S(`<rect class="b" x="8" y="34" width="180" height="30"/><path class="l" style="stroke-width:1.5" d="M38 34v30M68 34v30M98 34v30M128 34v30M158 34v30"/><text x="98" y="84">one texture image</text><path class="l" d="M196 49h28"/><path class="b" d="M250 22h40v40h-40z"/><path class="b" d="M250 22l16-12h40l-16 12z"/><path class="b" d="M290 22l16-12v40l-16 12z"/><text x="278" y="92">6 faces</text>`)};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const fm=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
document.getElementById("t").textContent=D.site.title;document.getElementById("g").textContent=D.site.tag;
N.innerHTML=T.map((t,i)=>`<button role="tab" data-i="${i}">${i+1}. ${t.title}</button>`).join("");
function show(i){
  const t=T[i];codes.length=0;
  P.innerHTML=`<span class="lv">${t.level}</span><span class="sp">Step ${i+1} of ${T.length}</span><h1>${t.title}</h1><p class="st">${fm(t.story)}</p>`+
  t.sections.map(s=>`<section><h2>${s.h}</h2>`+(s.p?`<p>${fm(s.p)}</p>`:"")+(s.img?`<figure>${IMG[s.img]}<figcaption>${s.cap||""}</figcaption></figure>`:"")+
  (s.code?(codes.push(s.code),`<div class="cb"><div class="ch"><span>${s.lang||"javascript"}</span><button class="cp" data-c="${codes.length-1}">Copy</button></div><pre><code>${esc(s.code)}</code></pre></div>`):"")+
  (s.tip?`<p class="tip">${fm(s.tip)}</p>`:"")+`</section>`).join("")+
  `<div class="pn">${i?`<button data-i="${i-1}">Previous: ${T[i-1].title}</button>`:"<span></span>"}${T[i+1]?`<button data-i="${i+1}">Next: ${T[i+1].title}</button>`:""}</div>`;
  N.querySelectorAll("button").forEach((b,k)=>{b.setAttribute("aria-selected",k==i);if(k==i)b.scrollIntoView({inline:"center",block:"nearest"})});
  window.scrollTo(0,0);try{location.hash=t.id}catch(e){}
}
async function cp(txt,b){try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.c!=null)cp(codes[+b.dataset.c],b);else if(b.dataset.i!=null)show(+b.dataset.i)});
show(Math.max(0,T.findIndex(t=>t.id==location.hash.slice(1))));
</script>
